<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Concept preview by Jad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#F3F5F9;--sf:#fff;--ink:#0F1E3D;--mu:#56617A;--ac:#1E40AF;--on:#fff;--hi:#EA580C;--display:system-ui,sans-serif;--body:system-ui,sans-serif;--r:10px;--rb:10px;--hw:700;--line:color-mix(in srgb,var(--ink) 14%,transparent)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
body.t-book,body.t-menu{padding-bottom:5.5rem}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:68rem;margin-inline:auto;padding-inline:1.25rem}
.ribbon{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:.45rem 1.25rem;background:var(--ink);color:var(--bg);font-size:.8125rem;line-height:1.35}
.ribbon button{flex:none;background:none;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:inherit;border-radius:99px;padding:.3rem .85rem;cursor:pointer;min-height:2rem}
.hero{padding:3rem 0 2.75rem}
.loc{margin:0 0 .9rem;font-size:.9375rem;font-weight:500;color:var(--mu)}
h1{font:var(--hw) clamp(2.5rem,10vw,5rem)/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere;max-width:16ch}
.tag{font-size:1.125rem;line-height:1.5;max-width:36ch;margin:1.1rem 0 0;color:var(--mu)}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.5rem;margin-top:1.75rem}
.hrs{font-size:.9375rem;color:var(--mu)}
.hrs b{color:var(--ink);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 4.5rem}
.cols>*{min-width:0}
.t-menu .main>*{min-width:0}
.sec{padding-top:2.75rem}
h2{font:var(--hw) clamp(1.5rem,5vw,2rem)/1.12 var(--display);letter-spacing:-.01em;margin:0 0 1.1rem}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;margin-top:2.75rem}
.panel h2{font-size:1.3rem}
.note{color:var(--mu);font-size:.875rem;margin:1rem 0 0;max-width:52ch}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);border-block:1px solid var(--line)}
.cats .wrap{display:flex;gap:.5rem;overflow-x:auto;padding-block:.6rem;scrollbar-width:none}
.cats a{flex:none;color:inherit;text-decoration:none;padding:.45rem 1rem;border:1px solid var(--line);border-radius:min(var(--rb),99px);font-size:.9375rem;min-height:2.5rem;display:inline-flex;align-items:center}
.menu,.rows{list-style:none;margin:0;padding:0}
.menu li{padding:.7rem 0}
.row{display:flex;align-items:baseline;gap:.6rem}
.nm{font-weight:600;font-size:1.0625rem}
.dots{flex:1;min-width:1.5rem;border-bottom:1px dotted color-mix(in srgb,var(--ink) 45%,transparent);transform:translateY(-.3em)}
.pr{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.ds{margin:.15rem 0 0;color:var(--mu);font-size:.9375rem;max-width:46ch}
.tent{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:center;background:var(--sf);border-radius:var(--r);padding:1.25rem;border:1px solid var(--line)}
.qr{width:7.5rem;aspect-ratio:1;background:#fff;padding:.5rem;border-radius:max(4px,min(var(--r),10px))}
.qr svg{display:block;width:100%;height:100%}
.tent .big{font:var(--hw) 1.35rem/1.15 var(--display);margin:0 0 .35rem}
.tent p{margin:0;color:var(--mu);font-size:.9375rem}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem 1.25rem}
.lbl{display:block;font-weight:600;margin:1.25rem 0 .55rem}
.lbl:first-child{margin-top:0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.7rem,1fr));gap:.5rem}
.chips.days{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.days .chip{flex:1 0 3.9rem}
.chip{background:transparent;border:1px solid var(--line);border-radius:min(var(--rb),14px);padding:.6rem .3rem;cursor:pointer;text-align:center;line-height:1.25;min-height:2.9rem;transition:background .15s,border-color .15s}
.chip:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
.chip small{display:block;color:var(--mu);font-size:.75rem}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.step{display:inline-flex;align-items:center;gap:1rem}
.step button{width:2.9rem;height:2.9rem;border-radius:min(var(--rb),99px);border:1px solid var(--line);background:transparent;font-size:1.35rem;cursor:pointer}
.step output{font:var(--hw) 1.5rem var(--display);min-width:2ch;text-align:center}
.in{width:100%;background:var(--bg);border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);border-radius:min(var(--rb),12px);padding:.8rem .9rem;min-height:3rem}
.in:focus-visible{outline-offset:1px}
.err{color:var(--ac);font-size:.875rem;font-weight:600;margin:.35rem 0 0}
.btn{display:inline-flex;justify-content:center;align-items:center;background:var(--ac);color:var(--on);border:0;border-radius:var(--rb);padding:.9rem 1.6rem;font:600 1rem var(--body);cursor:pointer;text-decoration:none;min-height:3rem;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn.wide{width:100%;margin-top:1.4rem}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.ticket{background:var(--sf);border-radius:var(--r);border:1px solid var(--line);border-top:4px solid var(--ac);padding:1.5rem 1.25rem}
.ticket .k{font-weight:600;margin:0;color:var(--mu)}
.ticket .big{font:var(--hw) clamp(1.7rem,7vw,2.25rem)/1.1 var(--display);margin:.4rem 0 .5rem}
.ticket p{margin:.2rem 0}
.ticket .live{margin:1rem 0 1.1rem;padding-top:1rem;border-top:1px dashed var(--line);color:var(--mu);font-size:.9375rem}
.rows{margin-top:.75rem}
.rows li{display:grid;grid-template-columns:4.6rem 1fr auto;gap:1rem;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.tm{font:var(--hw) 1.625rem/1 var(--display);font-variant-numeric:tabular-nums}
.tm small{display:block;font:500 .75rem var(--body);color:var(--mu);margin-top:.35rem}
.rows .nm{display:block;line-height:1.3}
.rows .sub{color:var(--mu);font-size:.875rem}
.rows .btn{padding:.55rem 1.1rem;min-height:2.75rem}
.rows .btn[disabled]{background:transparent;color:var(--mu);border:1px solid var(--line);cursor:default;filter:none}
.empty{color:var(--mu);padding:1.5rem 0}
.svc{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;width:100%;text-align:start;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.15rem;margin-bottom:.6rem;cursor:pointer;transition:border-color .15s}
.svc:hover{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.svc .sub{grid-column:1/-1;color:var(--mu);font-size:.875rem}
.svc[aria-pressed=true]{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.svc[aria-pressed=true] .nm::before{content:"\2713\00a0";color:var(--ac)}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:9;background:var(--sf);border-top:1px solid var(--line);padding:.7rem 1.25rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:1rem;align-items:center;justify-content:space-between}
.bar .sum{font-size:.9375rem;line-height:1.3}
.bar .sum b{display:block;font-size:1.0625rem;font-weight:600}
.bar .btn{flex:none}
.pitch{margin-top:4rem;padding-top:2.25rem;border-top:1px solid var(--line)}
.pitch h2{font-size:1.4rem}
.pitch p{max-width:48ch;margin:0;color:var(--mu)}
footer{padding:1.75rem 0 1.5rem;color:var(--mu);font-size:.875rem}
dialog{border:0;padding:0;background:var(--sf);color:var(--ink);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;width:100%;max-width:30rem;margin:auto auto 0}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{padding:1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom))}
dialog h2{margin-bottom:.25rem}
[dir=rtl] body,[dir=rtl] .btn,[dir=rtl] .tm small{font-family:"Tajawal",system-ui,sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .big,[dir=rtl] .tm,[dir=rtl] .step output{font-family:"Tajawal",system-ui,sans-serif;font-weight:700;font-style:normal;font-stretch:normal;letter-spacing:0;line-height:1.25}

/* Gyms, boxing, martial arts, courts */
.k-fight .hero{border-bottom:1px solid var(--line)}
.k-fight h1{text-transform:uppercase;font-size:clamp(3.25rem,15vw,7.5rem);line-height:.9;letter-spacing:0;max-width:12ch}
.k-fight h1::after,.k-trade h1::after{content:"";display:block;width:4.5rem;height:6px;background:var(--ac);margin-top:1.4rem}
.k-fight h2{text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1.75rem,6vw,2.4rem)}
.k-fight .tm{font-size:2rem}
.k-fight .btn{text-transform:uppercase;letter-spacing:.04em;font-weight:600}
[dir=rtl] .k-fight h1{font-size:clamp(2.75rem,12vw,5.5rem)}

/* Yoga, pilates, wellness */
.k-calm .hero{text-align:center;position:relative;overflow:hidden;padding-block:4rem 3.5rem}
.k-calm .hero::before{content:"";position:absolute;left:50%;top:50%;width:min(36rem,125vw);aspect-ratio:1;border-radius:50%;background:var(--hi);opacity:.6;transform:translate(-50%,-46%)}
.k-calm .hero .wrap{position:relative}
.k-calm h1{margin-inline:auto;letter-spacing:-.01em;line-height:1.08;font-size:clamp(2.4rem,9vw,4.5rem)}
.k-calm .tag{margin-inline:auto;font-family:var(--display);font-style:italic;color:var(--ink)}
.k-calm .loc,.k-calm .hrs{color:color-mix(in srgb,var(--ink) 80%,var(--hi))}
.k-calm .cta{flex-direction:column}
.k-calm h2{letter-spacing:0}

/* Salons, spas */
.k-beauty .hero{background:var(--hi);border-radius:0 0 2.5rem 2.5rem}
.k-beauty h1{font-style:italic;line-height:1.1;letter-spacing:-.01em;padding-bottom:.12em;font-size:clamp(2.5rem,9.5vw,4.75rem)}
.k-beauty .tag,.k-beauty .loc,.k-beauty .hrs{color:color-mix(in srgb,var(--ink) 82%,var(--hi))}
.k-beauty h2{letter-spacing:0}

/* Detailing, car care */
.k-auto .hero{background:linear-gradient(112deg,transparent 0 56%,rgba(255,255,255,.04) 56% 65%,transparent 65% 69%,rgba(255,255,255,.025) 69% 72%,transparent 72%),var(--bg);border-bottom:1px solid var(--line)}
.k-auto h1{font-stretch:125%;text-transform:uppercase;font-size:clamp(1.9rem,8vw,4.25rem);line-height:1.04;letter-spacing:0;max-width:15ch}
.k-auto h2{font-stretch:112%;font-size:clamp(1.2rem,4.2vw,1.5rem);text-transform:uppercase;letter-spacing:.05em}
.k-auto .loc{color:var(--ac);letter-spacing:.14em;text-transform:uppercase;font-size:.8125rem}
.k-auto .pr{color:var(--ac)}
.k-auto .btn{text-transform:uppercase;letter-spacing:.06em;font-size:.875rem}

/* Cafes, restaurants, barbers */
.k-cafe .hero{text-align:center}
.k-cafe .hero .wrap{max-width:46rem}
.k-cafe h1{margin-inline:auto;max-width:none;font-size:clamp(2rem,8.2vw,3.6rem);line-height:1.12;letter-spacing:.01em;padding-block:1.25rem;border-block:3px double var(--ink)}
.k-cafe .tag{margin-inline:auto;font-style:italic}
.k-cafe .cta{justify-content:center}
.k-cafe h2{letter-spacing:.02em}
.k-cafe .nm{font-weight:500}

/* Physio, clinics */
.k-clinic .hero{background:var(--sf);border-bottom:1px solid var(--line)}
.k-clinic h1{font-size:clamp(2.1rem,7.5vw,3.75rem);line-height:1.06;max-width:18ch}
.k-clinic .loc{display:inline-block;background:var(--hi);color:var(--ink);padding:.3rem .85rem;border-radius:99px;font-size:.875rem}

/* Kids, dance, music, arts */
.k-play .hero{background:var(--ac);color:var(--on);border-radius:0 0 2.25rem 2.25rem;position:relative;overflow:hidden;padding-top:3.5rem}
.k-play .hero::before{content:"";position:absolute;inset-inline-end:-3rem;top:-3rem;width:8rem;aspect-ratio:1;border-radius:50%;background:var(--hi)}
.k-play .hero .wrap{position:relative}
.k-play h1{line-height:1.02;letter-spacing:-.01em}
.k-play .tag,.k-play .loc,.k-play .hrs,.k-play .hrs b{color:inherit}
.k-play .hero .btn{background:var(--hi);color:var(--ink)}
.k-play .hero :focus-visible,.k-trade .hero :focus-visible{outline-color:#fff}
.k-play .rows li{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:.6rem}
.k-play .tm{color:var(--ac)}

/* Repairs, home services, training centres */
.k-trade .hero{background:var(--ink);color:#fff}
.k-trade h1{font-size:clamp(2.25rem,8.5vw,4.25rem);line-height:1.04}
.k-trade h1::after{width:3.5rem;height:5px;background:var(--hi);border-radius:3px;margin-top:1.25rem}
.k-trade .tag,.k-trade .loc,.k-trade .hrs{color:#C9D3E8}
.k-trade .hrs b{color:#fff}
.k-trade .hero .btn{background:#fff;color:var(--ink)}

@media (min-width:48rem){
 .wrap{padding-inline:2.5rem}
 .hero{padding:5rem 0 4.5rem}
 .k-calm .hero{padding-block:6rem 5.5rem}
 .k-play .hero::before{width:15rem;inset-inline-end:-4rem;top:-5rem}
 dialog{border-radius:calc(var(--r) + 6px);margin:auto}
 .card{padding:1.75rem}
}
@media (min-width:62rem){
 .cols{grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);align-items:start}
 .one>.main{max-width:46rem}
 .t-classes .side{position:sticky;top:1.5rem}
 .t-menu .main{display:grid;grid-template-columns:1fr 1fr;gap:0 3rem;align-items:start}
 .t-menu .main>.note,.t-menu .main>.full{grid-column:1/-1}
 .t-menu .cols{grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.chip,.svc{transition:none}}
</style>

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function loc(){return lang==='ar'?'ar-AE-u-nu-latn':'en-GB'}
function days(){var o=[],n=new Date();for(var i=0;i<7;i++)o.push(new Date(n.getFullYear(),n.getMonth(),n.getDate()+i));return o}
function f(d,opt){return new Intl.DateTimeFormat(loc(),opt).format(d)}
function tf(hm){var p=hm.split(':');return f(new Date(2026,0,1,+p[0],+p[1]),{hour:'numeric',minute:'2-digit',hour12:true})}
function price(p){if(p==null||p==='')return '';return typeof p==='number'?'AED '+p:esc(p)}
function iso(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
var store={get:function(k,d){try{var v=JSON.parse(localStorage.getItem('pv:'+slug+':'+k));return v==null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem('pv:'+slug+':'+k,JSON.stringify(v))}catch(e){}}};
var S={day:0,time:null,guests:2,svc:{},cls:null}, D=days();
if(L&&L.t==='classes'){for(var di=0;di<7;di++){var wd0=D[di].getDay();if((L.classes||[]).some(function(c){return c.d.indexOf(wd0)>-1})){S.day=di;break}}}

function plist(s){return '<ul class="menu">'+s.items.map(function(it){return '<li><div class="row"><span class="nm">'+esc(it.n)+'</span><span class="dots"></span><span class="pr">'+price(it.p)+'</span></div>'+(it.d?'<p class="ds">'+esc(it.d)+'</p>':'')+'</li>'}).join('')+'</ul>'}
function head(){
 var cta=L.t==='menu'?['ctaM','#s0']:L.t==='classes'?['ctaC','#week']:['ctaB','#svc'];
 return '<div class="ribbon"><span>'+tr('ribbon',{n:L.n})+'</span><button type="button" data-act="lang">'+tr('other')+'</button></div>'+
 '<header class="hero"><div class="wrap">'+(L.area?'<p class="loc">'+esc(L.area)+'</p>':'')+'<h1>'+esc(L.n)+'</h1>'+(L.tag?'<p class="tag">'+esc(L.tag)+'</p>':'')+
 '<div class="cta"><a class="btn" href="'+cta[1]+'">'+tr(cta[0])+'</a>'+(L.hours?'<span class="hrs"><b>'+tr('open')+'</b> '+esc(L.hours)+'</span>':'')+'</div></div></header>';
}
function tail(){return '<section class="wrap"><div class="pitch"><h2>'+tr('pitchH',{n:L.n})+'</h2><p>'+tr('pitchP')+'</p></div></section><footer class="wrap">'+tr('foot',{n:L.n})+'</footer>'}
function dayChips(){return '<div class="chips days" role="group" aria-label="'+tr('day')+'">'+D.map(function(d,i){return '<button type="button" class="chip" data-act="day" data-i="'+i+'" aria-pressed="'+(i===S.day)+'">'+esc(f(d,{weekday:'short'}))+'<small>'+esc(f(d,{day:'numeric',month:'short'}))+'</small></button>'}).join('')+'</div>'}
function timeChips(step,from){
 var o=Math.max(L.open||10,from||0),c=L.close||22,h='';
 for(var m=o*60;m<=c*60-step;m+=step){var hm=('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2);var nw=new Date(),taken=hash(slug+iso(D[S.day])+hm)%5===0||(S.day===0&&m<=nw.getHours()*60+nw.getMinutes()+30);
  h+='<button type="button" class="chip" data-act="time" data-t="'+hm+'" aria-pressed="'+(S.time===hm)+'"'+(taken?' disabled':'')+'>'+esc(tf(hm))+'</button>'}
 return h;
}
function fields(notes){return '<label class="lbl" for="nm">'+tr('name')+'</label><input class="in" id="nm" autocomplete="name"><p class="err" id="eNm" role="alert"></p>'+
 '<label class="lbl" for="ph">'+tr('phone')+'</label><input class="in" id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="05X XXX XXXX"><p class="err" id="ePh" role="alert"></p>'+
 (notes?'<label class="lbl" for="nt">'+tr('notes')+'</label><textarea class="in" id="nt" rows="2"></textarea>':'')}
function ticket(k,big,line){return '<div class="ticket" role="status"><p class="k">'+k+'</p><p class="big">'+big+'</p><p>'+line+'</p><p>'+tr('ref',{r:'R-'+(1000+hash(String(Date.now()))%9000)})+'</p><p class="live">'+tr('live',{n:L.n})+'</p><button type="button" class="btn ghost" data-act="again">'+tr('again')+'</button></div>'}
function whenText(){return esc(f(D[S.day],{weekday:'long',day:'numeric',month:'long'}))+', '+esc(tf(S.time))}

function menuView(){
 var secs=L.sections||[],h=head();
 if(secs.length>1)h+='<nav class="cats"><div class="wrap">'+secs.map(function(s,i){return '<a href="#s'+i+'">'+esc(s.title)+'</a>'}).join('')+'<a href="#reserve">'+tr('resH')+'</a></div></nav>';
 h+='<main class="wrap cols"><div class="main">'+secs.map(function(s,i){return '<section class="sec" id="s'+i+'"><h2>'+esc(s.title)+'</h2>'+plist(s)+'</section>'}).join('')+'<p class="note">'+tr(L.real?'mReal':'mSample')+'</p>'+
 '<section class="sec full"><h2>'+tr('tentH')+'</h2><div class="tent"><div class="qr" id="qr"></div><div><p class="big">'+tr('scan')+'</p><p>'+tr('tentP')+'</p></div></div></section></div>'+
 '<section class="sec side" id="reserve"><h2>'+tr('resH')+'</h2><div id="formBox">'+resForm()+'</div></section></main>';
 h+=tail()+'<div class="bar"><div class="sum"><b>'+esc(L.n)+'</b>'+(L.hours?esc(L.hours):'')+'</div><a class="btn" href="#reserve">'+tr('resGo')+'</a></div>';
 return h;
}
function resForm(){return '<form class="card" id="resF" novalidate><span class="lbl">'+tr('day')+'</span>'+dayChips()+'<span class="lbl">'+tr('time')+'</span><div class="chips" id="times">'+timeChips(30,12)+'</div><p class="note">'+tr('avail')+'</p><p class="err" id="eT" role="alert"></p>'+
 '<span class="lbl">'+tr('guests')+'</span><div class="step"><button type="button" data-act="g-" aria-label="-">&minus;</button><output id="gN">'+S.guests+'</output><button type="button" data-act="g+" aria-label="+">+</button></div>'+fields(true)+'<button class="btn wide">'+tr('resBtn')+'</button></form>'}

function classesView(){
 var h=head(),secs=L.sections||[];
 h+='<main class="wrap '+(secs.length?'cols':'one')+'"><section class="sec main" id="week"><h2>'+tr('clsH')+'</h2>'+dayChips()+'<ul class="rows" id="cls"></ul><p class="note">'+tr(L.real===true?'cReal':L.real==='names'?'cSample':'cNone')+'</p></section>';
 if(secs.length)h+='<aside class="side">'+secs.map(function(s){return '<section class="panel"><h2>'+esc(s.title)+'</h2>'+plist(s)+'</section>'}).join('')+'</aside>';
 h+='</main>'+tail()+'<dialog id="sheet"><form id="spotF" novalidate><h2>'+tr('sheetH')+'</h2><p class="note" id="sheetSub" style="margin:0 0 1rem"></p>'+fields(false)+'<button class="btn wide">'+tr('spotBtn')+'</button><button type="button" class="btn ghost wide" data-act="close" style="margin-top:.6rem">'+tr('cancel')+'</button></form></dialog>';
 return h;
}
function drawClasses(){
 var box=document.getElementById('cls');if(!box)return;var d=D[S.day],wd=d.getDay(),bk=store.get('bk',{});
 var list=(L.classes||[]).filter(function(c){return c.d.indexOf(wd)>-1}).sort(function(a,b){return a.t<b.t?-1:1});
 if(!list.length){box.innerHTML='<li class="empty" style="display:block">'+tr('none')+'</li>';return}
 box.innerHTML=list.map(function(c){var key=iso(d)+'|'+c.t+'|'+c.n,cap=c.cap||12,mine=!!bk[key],left=Math.max(0,cap-(hash(slug+key)%(cap+1))-(mine?1:0));if(mine&&left<0)left=0;
  var sub=[tr('mins',{m:c.m||60})];if(c.c)sub.push(tr('withc',{c:c.c}));sub.push(mine?tr('booked'):(left?tr('left',{k:left}):tr('full')));
  return '<li><div class="tm">'+esc(tf(c.t).replace(/\s?[ap]m/i,''))+'<small>'+esc((tf(c.t).match(/[ap]m|[صم]/i)||[''])[0])+'</small></div><div><span class="nm">'+esc(c.n)+'</span><span class="sub">'+sub.join(', ')+'</span></div>'+
  '<button type="button" class="btn" data-act="spot" data-k="'+esc(key)+'" data-n="'+esc(c.n)+'" data-t="'+c.t+'"'+((mine||!left)?' disabled':'')+'>'+(mine?tr('booked'):(left?tr('book'):tr('full')))+'</button></li>'}).join('');
}

function bookView(){
 var h=head(),secs=L.sections||[],i=0;
 h+='<main class="wrap cols"><section class="sec main" id="svc"><h2>'+tr('svcH')+'</h2>'+secs.map(function(s){return (secs.length>1?'<p class="lbl">'+esc(s.title)+'</p>':'')+s.items.map(function(it){var k=i++;return '<button type="button" class="svc" data-act="svc" data-i="'+k+'" aria-pressed="'+!!S.svc[k]+'"><span class="nm">'+esc(it.n)+'</span><span class="pr">'+price(it.p)+'</span><span class="sub">'+(it.m?tr('mins',{m:it.m}):'')+(it.d?(it.m?', ':'')+esc(it.d):'')+'</span></button>'}).join('')}).join('')+'<p class="note">'+tr(L.real===true?'sReal':L.real==='names'?'sNames':'sSample')+'</p><p class="err" id="eS" role="alert"></p></section>';
 h+='<section class="sec side" id="when"><h2>'+tr('whenH')+'</h2><div id="formBox"><form class="card" id="bookF" novalidate>'+dayChips()+'<span class="lbl">'+tr('time')+'</span><div class="chips" id="times">'+timeChips(45,0)+'</div><p class="note">'+tr('avail')+'</p><p class="err" id="eT" role="alert"></p><p class="lbl">'+tr('detH')+'</p>'+fields(true)+'<button class="btn wide">'+tr('bookBtn')+'</button></form></div></section></main>';
 h+=tail()+'<div class="bar"><div class="sum" id="sum"></div><a class="btn" href="#when">'+tr('barGo')+'</a></div>';
 return h;
}
function flat(){var o=[];(L.sections||[]).forEach(function(s){s.items.forEach(function(it){o.push(it)})});return o}
function picked(){var a=flat();return Object.keys(S.svc).filter(function(k){return S.svc[k]}).map(function(k){return a[k]})}
function drawSum(){var el=document.getElementById('sum');if(!el)return;var p=picked();if(!p.length){el.innerHTML='<b>'+tr('barNone')+'</b>';return}
 var tot=0,num=true,mins=0;p.forEach(function(x){if(typeof x.p==='number')tot+=x.p;else num=false;mins+=x.m||0});
 el.innerHTML='<b>'+tr('barN',{k:p.length})+(num&&tot?', AED '+tot:'')+'</b>'+(mins?tr('mins',{m:mins}):'')}

function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 if(!L){app.innerHTML='<div class="wrap sec"><h2>'+tr('missH')+'</h2><p>'+tr('missP')+'</p></div>';return}
 document.title=L.n+' | concept preview by Jad';
 app.innerHTML=L.t==='menu'?menuView():L.t==='classes'?classesView():bookView();
 if(L.t==='classes')drawClasses();
 if(L.t==='book')drawSum();
 if(L.t==='menu')drawQR();
}
function drawQR(){var el=document.getElementById('qr');if(!el)return;function go(){try{var q=window.qrcode(0,'M');q.addData(location.origin+location.pathname+(window.SLUG?'':'?b='+slug));q.make();el.innerHTML=q.createSvgTag({scalable:true,margin:0})}catch(e){el.style.display='none'}}
 if(window.qrcode)return go();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=go;s.onerror=function(){el.style.display='none'};document.head.appendChild(s)}
function setErr(id,msg){var e=document.getElementById(id);if(e)e.textContent=msg||''}
function checkPerson(){var n=document.getElementById('nm').value.trim(),p=document.getElementById('ph').value.replace(/[^\d+]/g,'');setErr('eNm',n?'':tr('eName'));setErr('ePh',p.length>=7?'':tr('ePhone'));return n&&p.length>=7}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
 if(a==='lang'){lang=lang==='ar'?'en':'ar';render();window.scrollTo(0,0)}
 else if(a==='day'){S.day=+b.getAttribute('data-i');S.time=null;[].forEach.call(b.parentNode.children,function(c){c.setAttribute('aria-pressed',c===b)});var t=document.getElementById('times');if(t)t.innerHTML=timeChips(L.t==='menu'?30:45,L.t==='menu'?12:0);drawClasses()}
 else if(a==='time'){S.time=b.getAttribute('data-t');[].forEach.call(b.parentNode.children,function(c){c.setAttribute('aria-pressed',c===b)});setErr('eT','')}
 else if(a==='g-'||a==='g+'){S.guests=Math.min(20,Math.max(1,S.guests+(a==='g+'?1:-1)));document.getElementById('gN').textContent=S.guests}
 else if(a==='svc'){var i=b.getAttribute('data-i');S.svc[i]=!S.svc[i];b.setAttribute('aria-pressed',!!S.svc[i]);setErr('eS','');drawSum()}
 else if(a==='spot'){S.cls={k:b.getAttribute('data-k'),n:b.getAttribute('data-n'),t:b.getAttribute('data-t')};document.getElementById('sheetSub').textContent=S.cls.n+', '+f(D[S.day],{weekday:'long',day:'numeric',month:'long'})+', '+tf(S.cls.t);document.getElementById('sheet').showModal()}
 else if(a==='close'){document.getElementById('sheet').close()}
 else if(a==='again'){S.time=null;S.svc={};render();var w=document.getElementById(L.t==='menu'?'reserve':L.t==='book'?'svc':'cls');if(w)w.scrollIntoView()}
});
document.addEventListener('submit',function(e){
 e.preventDefault();var id=e.target.id,box=document.getElementById('formBox');
 if(id==='resF'){var ok=checkPerson();if(!S.time){setErr('eT',tr('eTime'));ok=false}if(!ok)return;box.innerHTML=ticket(tr('doneTable'),tr('tableFor',{g:S.guests}),whenText());box.scrollIntoView({block:'center'})}
 else if(id==='bookF'){var ok2=checkPerson();if(!S.time){setErr('eT',tr('eTime'));ok2=false}if(!picked().length){setErr('eS',tr('eSvc'));document.getElementById('svc').scrollIntoView();return}if(!ok2)return;
  box.innerHTML=ticket(tr('doneBook'),picked().map(function(x){return esc(x.n)}).join(' + '),whenText());box.scrollIntoView({block:'center'})}
 else if(id==='spotF'){if(!checkPerson())return;var bk=store.get('bk',{});bk[S.cls.k]=1;store.set('bk',bk);var dlg=document.getElementById('sheet');
  dlg.innerHTML='<div style="padding:1.25rem">'+ticket(tr('doneSpot'),esc(S.cls.n),esc(f(D[S.day],{weekday:'long',day:'numeric',month:'long'}))+', '+esc(tf(S.cls.t))).replace('data-act="again"','data-act="closeDone"')+'</div>';drawClasses()}
});
document.addEventListener('click',function(e){if(e.target.closest('[data-act="closeDone"]')){document.getElementById('sheet').close();render()}});

 calm:'ancient-yoga equi-pilates roshiross cloud-pilates samudra keyani maya-blu hatha-vidya pratimoksha',

 play:'smith-academy sargam vibes-arts dance-dazzle ocean-kids',
 trade:'mr-fixer ecoplus fix-all-now sahara-fix spoton zillionpathways'};
var K={
 fight:{bg:'#15181D',sf:'#1E2329',ink:'#F4F2EC',mu:'#A3A9B3',ac:'#F97316',on:'#1A0E04',hi:'#F4F2EC',d:'Barlow Condensed',b:'Barlow',hw:700,r:'4px',rb:'4px',gf:'Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600'},
 calm:{bg:'#EFF3EE',sf:'#FFFFFF',ink:'#1F2D27',mu:'#55645D',ac:'#2E5E4E',on:'#FFFFFF',hi:'#D3E2D6',d:'Lora',b:'Raleway',hw:500,r:'20px',rb:'999px',gf:'Lora:ital,wght@0,400;0,500;1,400&family=Raleway:wght@400;500;600'},
 beauty:{bg:'#FCF5F6',sf:'#FFFFFF',ink:'#2C1A23',mu:'#75606B',ac:'#A8325E',on:'#FFFFFF',hi:'#F3D5DE',d:'Playfair Display',b:'DM Sans',hw:500,r:'18px',rb:'999px',gf:'Playfair+Display:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500;600'},
 auto:{bg:'#0D1013',sf:'#161B20',ink:'#EEF1F4',mu:'#98A2AD',ac:'#D8B25A',on:'#14100A',hi:'#EEF1F4',d:'Archivo',b:'Archivo',hw:700,r:'6px',rb:'6px',gf:'Archivo:wdth,wght@62..125,100..900'},
 cafe:{bg:'#FBF6EC',sf:'#FFFDF8',ink:'#2A1D14',mu:'#6A5A4E',ac:'#92400E',on:'#FFFFFF',hi:'#E7D7BD',d:'Playfair Display SC',b:'Karla',hw:700,r:'4px',rb:'4px',gf:'Playfair+Display+SC:wght@400;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400'},
 clinic:{bg:'#F2F9F9',sf:'#FFFFFF',ink:'#0F2F36',mu:'#4A656B',ac:'#0E7490',on:'#FFFFFF',hi:'#CFECEC',d:'Figtree',b:'Figtree',hw:700,r:'14px',rb:'12px',gf:'Figtree:wght@400;500;600;700'},
 play:{bg:'#F2F6FF',sf:'#FFFFFF',ink:'#172554',mu:'#535E88',ac:'#2563EB',on:'#FFFFFF',hi:'#FBBF24',d:'Baloo 2',b:'Nunito',hw:800,r:'22px',rb:'999px',gf:'Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700'},
 trade:{bg:'#F3F5F9',sf:'#FFFFFF',ink:'#0F1E3D',mu:'#56617A',ac:'#1E40AF',on:'#FFFFFF',hi:'#EA580C',d:'Work Sans',b:'Work Sans',hw:700,r:'10px',rb:'10px',gf:'Work+Sans:wght@400;500;600;700'}
};
if(L){var kind=L.t==='menu'?'cafe':L.t==='classes'?'fight':'trade';Object.keys(KM).forEach(function(x){if((' '+KM[x]+' ').indexOf(' '+slug+' ')>-1)kind=x});
 var k=K[kind],r=document.documentElement.style;['bg','sf','ink','mu','ac','on','hi'].forEach(function(x){r.setProperty('--'+x,k[x])});
 r.setProperty('--display','"'+k.d+'",system-ui,sans-serif');r.setProperty('--body','"'+k.b+'",system-ui,sans-serif');r.setProperty('--hw',k.hw);r.setProperty('--r',k.r);r.setProperty('--rb',k.rb);
 document.body.className='k-'+kind+' t-'+L.t;
 var fl=document.createElement('link');fl.rel='stylesheet';fl.href='https://fonts.googleapis.com/css2?family='+k.gf+'&family=Tajawal:wght@400;500;700&display=swap';document.head.appendChild(fl)}
render();
})();
